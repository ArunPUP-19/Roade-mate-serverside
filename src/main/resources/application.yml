# RouteMate Backend Configuration
spring:
  application:
    name: routemate-backend

  # H2 In-Memory Database (swap to PostgreSQL for production)
  datasource:
    url: jdbc:h2:mem:routemate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console (dev only)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# Server
server:
  port: 5000
  shutdown: graceful

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Application-specific
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

# Logging
logging:
  level:
    com.routemate: DEBUG
    org.hibernate.SQL: DEBUG
